<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ded5c4" />
<title>錦鯉の池 — Nishikigoi Pond</title>
<style>
:root{
  --ink:#272219;
  --ink-soft:rgba(39,34,25,.62);
  --seal:#b23a2a;
  --glass:rgba(20,26,24,.62);
  --line:rgba(255,255,255,.12);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#171a17}
body{
  font-family:"Noto Serif JP","Source Han Serif SC","Hiragino Mincho ProN","Yu Mincho",serif;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(125% 105% at 50% 42%, transparent 52%, rgba(12,14,10,.30) 100%);
}
.paper{
  position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.055;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/></svg>");
}
.brand{
  position:fixed;z-index:4;top:calc(24px + env(safe-area-inset-top));left:calc(22px + env(safe-area-inset-left));
  display:flex;flex-direction:column;align-items:flex-start;gap:12px;
  color:var(--ink);pointer-events:none;transition:color .9s ease;
}
.title{
  writing-mode:vertical-rl;text-orientation:upright;
  font-size:clamp(27px,3.3vw,42px);
  letter-spacing:.24em;line-height:1.02;
  text-shadow:0 1px 0 rgba(255,255,255,.22);
  font-weight:500;
}
.seal{
  width:30px;height:30px;border-radius:3px;background:var(--seal);
  color:#f3e9d6;display:grid;place-items:center;
  font-size:15px;line-height:1;letter-spacing:0;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18), 0 2px 6px rgba(60,20,10,.25);
  transform:rotate(-2.5deg);
}
.caption{
  writing-mode:vertical-rl;text-orientation:upright;
  font-size:8.5px;letter-spacing:.34em;color:var(--ink-soft);
  margin-top:1px;
}
.night .brand{color:#efe8d8}
.night .caption{color:rgba(239,232,216,.55)}

.controls{
  position:fixed;z-index:5;left:50%;
  bottom:calc(20px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  display:flex;gap:4px;padding:7px;
  border-radius:999px;
  background:var(--glass);
  border:1px solid var(--line);
  box-shadow:0 12px 42px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(16px) saturate(1.1);
  -webkit-backdrop-filter:blur(16px) saturate(1.1);
}
.controls button{
  appearance:none;border:0;background:transparent;color:#e9e2d2;
  width:66px;height:54px;border-radius:999px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:inherit;cursor:pointer;
  transition:background .2s ease,color .2s ease,transform .12s ease;
}
.controls button svg{width:19px;height:19px;opacity:.88}
.controls button span{font-size:9.5px;letter-spacing:.18em;opacity:.72;white-space:nowrap}
.controls button:hover{background:rgba(255,255,255,.08)}
.controls button:active{transform:scale(.94)}
.controls button.on{background:rgba(222,196,148,.16);color:#f6ecd6}
.controls button:focus-visible{outline:1px solid rgba(240,226,196,.7);outline-offset:2px}

.hint{
  position:fixed;z-index:4;left:50%;
  bottom:calc(92px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  font-size:10.5px;letter-spacing:.14em;
  color:rgba(244,238,224,.82);
  background:rgba(20,25,23,.42);
  border:1px solid rgba(255,255,255,.08);
  padding:7px 15px;border-radius:999px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  white-space:nowrap;pointer-events:none;
  transition:opacity .9s ease, transform .9s ease;
}
.hint.hide{opacity:0;transform:translate(-50%,6px)}

.info{
  position:fixed;z-index:4;left:50%;
  bottom:calc(92px + env(safe-area-inset-bottom));
  transform:translate(-50%,10px);
  min-width:212px;max-width:78vw;
  padding:13px 18px 12px;
  border-radius:14px;
  background:rgba(17,22,20,.66);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 14px 40px rgba(0,0,0,.34);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:#efe7d6;text-align:center;
  opacity:0;pointer-events:none;
  transition:opacity .45s ease, transform .45s ease;
}
.info.show{opacity:1;transform:translate(-50%,0)}
.info .jp{font-size:16.5px;letter-spacing:.20em;padding-left:.20em}
.info .en{font-size:8px;letter-spacing:.30em;opacity:.5;margin-top:4px;text-transform:uppercase}
.info .poem{font-size:10px;letter-spacing:.10em;opacity:.72;margin-top:2px}
.info .meta{font-size:9px;letter-spacing:.12em;opacity:.45;margin-top:6px}
.info .rule{height:1px;background:linear-gradient(90deg,transparent,rgba(230,214,180,.28),transparent);margin:8px 0 7px}

@media (max-width:520px){
  .controls button{width:60px;height:52px}
  .controls button span{font-size:9px}
  .brand{top:calc(20px + env(safe-area-inset-top));left:calc(18px + env(safe-area-inset-left))}
  .hint{font-size:9.5px;letter-spacing:.08em;padding:6px 12px}
  .info{bottom:calc(90px + env(safe-area-inset-bottom))}
}
@media (max-width:360px){
  .controls{gap:2px;padding:6px}
  .controls button{width:52px;height:50px}
  .controls button svg{width:18px;height:18px}
}
@media (max-height:460px){
  .brand{transform:scale(.82);transform-origin:top left}
  .controls{bottom:calc(10px + env(safe-area-inset-bottom))}
  .hint{display:none}
}

</style>
</head>
<body>
<canvas id="scene" aria-label="インタラクティブな錦鯉の池"></canvas>
<div class="vignette"></div>
<div class="paper"></div>

<header class="brand" aria-label="錦鯉の池">
  <div class="title">錦鯉の池</div>
  <div class="seal">鯉</div>
  <div class="caption">静寂の庭</div>
</header>

<div class="hint" id="hint">水面をタップして餌を撒く · 魚をタップして観察</div>

<div class="info" id="info" role="status" aria-live="polite">
  <div class="jp"></div>
  <div class="en"></div>
  <div class="rule"></div>
  <div class="poem"></div>
  <div class="meta"></div>
</div>

<nav class="controls" aria-label="操作">
  <button id="btn-feed" aria-label="餌を撒く">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.2 14.4c0-2.2 1.9-3.7 4.2-3.7h7.2c2.3 0 4.2 1.5 4.2 3.7 0 2.6-2.2 4.4-4.6 4.4H8.8c-2.4 0-4.6-1.8-4.6-4.4Z"/>
      <path d="M8.2 10.5c.2-2.6 1.9-4.4 4.3-4.4 2 0 3.5 1.2 4 3"/>
      <circle cx="8" cy="6.4" r=".7" fill="currentColor" stroke="none"/>
      <circle cx="15.8" cy="4.6" r=".7" fill="currentColor" stroke="none"/>
      <circle cx="12.6" cy="6.1" r=".55" fill="currentColor" stroke="none"/>
    </svg>
    <span>餌</span>
  </button>
  <button id="btn-ripple" aria-label="波紋を起こす">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round">
      <circle cx="12" cy="12" r="2.3"/>
      <circle cx="12" cy="12" r="6" opacity=".72"/>
      <circle cx="12" cy="12" r="9.6" opacity=".42"/>
    </svg>
    <span>波紋</span>
  </button>
  <button id="btn-season" aria-label="季節を切り替える">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 11.2C10.6 9.9 10 8.7 10 7.5 10 5.9 11 4.8 12 3.4c1 1.4 2 2.5 2 4.1 0 1.2-.6 2.4-2 3.7Z"/>
      <path d="M12.8 12c1.3-1.4 2.5-2 3.7-2 1.6 0 2.7 1 4.1 2-1.4 1-2.5 2-4.1 2-1.2 0-2.4-.6-3.7-2Z" opacity=".78"/>
      <path d="M12 12.8c1.4 1.3 2 2.5 2 3.7 0 1.6-1 2.7-2 4.1-1-1.4-2-2.5-2-4.1 0-1.2.6-2.4 2-3.7Z" opacity=".56"/>
      <path d="M11.2 12C9.9 13.4 8.7 14 7.5 14c-1.6 0-2.7-1-4.1-2 1.4-1 2.5-2 4.1-2 1.2 0 2.4.6 3.7 2Z" opacity=".86"/>
    </svg>
    <span id="season-label">秋</span>
  </button>
  <button id="btn-night" aria-label="昼夜を切り替える">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.2 14.7A8 8 0 0 1 9.3 3.8a8.2 8.2 0 1 0 10.9 10.9Z"/>
    </svg>
    <span>夜</span>
  </button>
  <button id="btn-sound" aria-label="水音を切り替える">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 9.5h3l4-3.2v11.4l-4-3.2h-3z"/>
      <path d="M15.2 8.6a4.8 4.8 0 0 1 0 6.8" opacity=".8"/>
      <path d="M17.8 6a8.3 8.3 0 0 1 0 12" opacity=".5"/>
    </svg>
    <span>音</span>
  </button>
</nav>

<script>
'use strict';
/* ============================================================
   錦鯉の池 — core: helpers, layout, garden background
   ============================================================ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 0, b = 1) => a + Math.random() * (b - a);
const smoothT = t => t * t * (3 - 2 * t);

function angDiff(a, b) {
  let d = (a - b + Math.PI) % TAU;
  if (d < 0) d += TAU;
  return d - Math.PI;
}
function hexA(hex, a) {
  if (hex.startsWith('rgba')) return hex;
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255);
  const g = clamp(((n >> 8) & 255) + amt, 0, 255);
  const b = clamp((n & 255) + amt, 0, 255);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d', { alpha: false });

const KP = {
  W: 0, H: 0, DPR: 1,
  time: 0, night: 0, nightTarget: 0,
  season: 2, seasonFade: 1,
  pond: { cx: 0, cy: 0, rx: 1, ry: 1 },
  env: {},
  fish: [], pellets: [], ripples: [], pads: [], floating: [], fireflies: [], parts: [],
  B: 84, bg: null, bgPrev: null, selected: null,
};

/* ---------------- pond shape ---------------- */

function layout() {
  const { W, H } = KP;
  const wide = W > H;
  const p = KP.pond;
  p.cx = W * 0.5 + (wide ? W * 0.02 : 0);
  if (wide) {
    p.cy = H * 0.52;
    p.rx = Math.min(W * 0.43, H * 0.74);
    p.ry = Math.min(H * 0.385, W * 0.39);
  } else {
    p.cy = H * 0.48;
    p.rx = W * 0.455;
    p.ry = Math.min(H * 0.34, W * 0.55);
  }
  KP.B = clamp(Math.min(W, H) * 0.155, 54, 122);
  const lr = clamp(Math.min(W, H) * 0.054, 22, 52);
  KP.env.lantern = {
    x: Math.min(W - lr - 10, p.cx + p.rx * 1.16),
    y: p.cy - p.ry * 0.52,
    r: lr,
  };
  KP.env.maple = { x: W * 0.845, y: H * 0.095, scale: clamp(Math.min(W, H) / 800, 0.62, 1.15) };
}

function pondRadius(th) {
  return 1 + 0.035 * Math.sin(th * 3 + 1.7) + 0.022 * Math.sin(th * 5 - 0.4) + 0.014 * Math.cos(th * 7 + 2.2);
}
function pondPath(c, inset = 1) {
  const p = KP.pond, N = 180;
  c.beginPath();
  for (let i = 0; i <= N; i++) {
    const th = i / N * TAU;
    const R = pondRadius(th) * inset;
    const x = p.cx + Math.cos(th) * p.rx * R;
    const y = p.cy + Math.sin(th) * p.ry * R;
    if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
  }
  c.closePath();
}
function pondPolar(x, y) {
  const p = KP.pond;
  const dx = (x - p.cx) / p.rx;
  const dy = (y - p.cy) / p.ry;
  const th = Math.atan2(dy, dx);
  return { th, r: Math.hypot(dx, dy) / pondRadius(th) };
}
function smoothClosed(c, pts) {
  const n = pts.length;
  if (n < 3) return;
  c.beginPath();
  let mx = (pts[n - 1].x + pts[0].x) / 2;
  let my = (pts[n - 1].y + pts[0].y) / 2;
  c.moveTo(mx, my);
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    c.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
  }
  c.closePath();
}
function roundRectPath(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

/* ---------------- koi body profile (shared) ---------------- */

const BODY = { bodyFrac: 0.745, halfWFrac: 0.160, tailFrac: 0.265 };

const WIDTH_KEYS = [
  [0, 0.42], [0.025, 0.58], [0.06, 0.73], [0.11, 0.85], [0.17, 0.93],
  [0.24, 0.985], [0.32, 1.0], [0.41, 0.99], [0.50, 0.95], [0.59, 0.88],
  [0.67, 0.78], [0.75, 0.66], [0.82, 0.53], [0.88, 0.41], [0.93, 0.30],
  [0.97, 0.22], [1, 0.165],
];
function widthAt(s) {
  s = clamp(s, 0, 1);
  for (let i = 1; i < WIDTH_KEYS.length; i++) {
    if (s <= WIDTH_KEYS[i][0]) {
      const [s0, w0] = WIDTH_KEYS[i - 1];
      const [s1, w1] = WIDTH_KEYS[i];
      return lerp(w0, w1, smoothT((s - s0) / (s1 - s0)));
    }
  }
  return 0.145;
}

/* ---------------- seasons ---------------- */

const SEASON_KEYS = ['spring', 'summer', 'autumn', 'winter'];
const SEASON = {
  spring: {
    jp: '春', caption: '花筏の庭', tree: 'sakura', ambient: 'petal',
    gravel: ['#efe9da', '#e4dbc7', '#cec2a9'],
    gravelLight: 'rgba(255,251,239,.62)',
    speck: [112, 96, 72], rake: 'rgba(148,129,102,.15)',
    moss: ['rgba(103,126,62,.58)', 'rgba(127,150,82,.44)', 'rgba(88,109,53,.30)'],
    water: ['#6f9c84', '#4f816b', '#306354', '#1d493f', '#0f302c', '#082321'],
    surface: [216, 244, 224], reflect: [210, 148, 163],
    reeds: ['#5f7a3e', '#748f4c', '#4c6532', '#86a05a'],
    lotus: ['#f8d8df', '#f0b5c3', '#da8fa1'],
    padScale: 0.80, lotuses: 0, ice: 0, snow: 0,
  },
  summer: {
    jp: '夏', caption: '涼風の庭', tree: 'green', ambient: 'pollen',
    gravel: ['#e9dec6', '#dacbae', '#c1af8f'],
    gravelLight: 'rgba(255,248,224,.62)',
    speck: [118, 99, 66], rake: 'rgba(140,120,88,.16)',
    moss: ['rgba(73,102,44,.62)', 'rgba(91,121,55,.48)', 'rgba(61,88,37,.36)'],
    water: ['#7dac8e', '#4f8469', '#2c604b', '#184538', '#0c2a25', '#071f1b'],
    surface: [219, 249, 227], reflect: [120, 150, 80],
    reeds: ['#4d6c32', '#63823f', '#3f5b2a', '#79964c'],
    lotus: ['#f9d5de', '#f0adbD', '#d77f93'],
    padScale: 1.14, lotuses: 2, ice: 0, snow: 0,
  },
  autumn: {
    jp: '秋', caption: '紅葉の庭', tree: 'maple', ambient: 'leaf',
    gravel: ['#e9e1d0', '#ded5c2', '#c8bca5'],
    gravelLight: 'rgba(255,251,238,.55)',
    speck: [108, 92, 66], rake: 'rgba(137,123,98,.16)',
    moss: ['rgba(84,96,52,.55)', 'rgba(112,124,70,.42)', 'rgba(74,86,46,.30)'],
    water: ['#5b8877', '#3d6c5e', '#255149', '#173c38', '#0d2928', '#071c1d'],
    surface: [185, 231, 213], reflect: [158, 72, 44],
    reeds: ['#5c6f3b', '#6f8248', '#495c31', '#7d8c4e'],
    lotus: ['#f4cfd6', '#e7a2b0', '#d98797'],
    padScale: 0.92, lotuses: 1, ice: 0, snow: 0,
  },
  winter: {
    jp: '冬', caption: '雪見の庭', tree: 'bare', ambient: 'snow',
    gravel: ['#f4f3ed', '#e7e7df', '#d0d3cb'],
    gravelLight: 'rgba(255,255,252,.72)',
    speck: [148, 156, 150], rake: 'rgba(158,168,164,.14)',
    moss: ['rgba(236,243,244,.62)', 'rgba(205,218,220,.42)', 'rgba(150,166,160,.20)'],
    water: ['#6c8991', '#4a6972', '#2e4f58', '#1d363e', '#10272e', '#0a1b20'],
    surface: [193, 222, 234], reflect: [176, 202, 214],
    reeds: ['#8a7a55', '#9c8a60', '#756747', '#ab9a70'],
    lotus: ['#f2e4e8', '#dfcbd2', '#c3aab3'],
    padScale: 0, lotuses: 0, ice: 1, snow: 1,
  },
};
function sea() { return SEASON[SEASON_KEYS[KP.season]] || SEASON.autumn; }
function isSeason(key) { return SEASON_KEYS[KP.season] === key; }

/* ---------------- garden background ---------------- */

function drawRakedGravel(c) {
  const { W, H } = KP;
  const s = sea();
  const g = c.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, s.gravel[0]);
  g.addColorStop(0.42, s.gravel[1]);
  g.addColorStop(1, s.gravel[2]);
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);

  const lw = c.createRadialGradient(W * 0.26, H * 0.06, 0, W * 0.26, H * 0.06, Math.max(W, H) * 0.85);
  lw.addColorStop(0, s.gravelLight);
  lw.addColorStop(0.6, 'rgba(255,251,238,.12)');
  lw.addColorStop(1, 'rgba(255,251,238,0)');
  c.fillStyle = lw;
  c.fillRect(0, 0, W, H);

  if (isSeason('winter')) {
    const rng = mulberry32(191);
    for (let i = 0; i < 16; i++) {
      const x = rng() * W, y = rng() * H;
      const r = (40 + rng() * 130) * clamp(Math.min(W, H) / 800, 0.55, 1.2);
      const sg = c.createRadialGradient(x, y, 0, x, y, r);
      sg.addColorStop(0, 'rgba(176,194,201,.13)');
      sg.addColorStop(0.6, 'rgba(186,202,208,.07)');
      sg.addColorStop(1, 'rgba(190,206,212,0)');
      c.fillStyle = sg;
      c.beginPath();
      c.ellipse(x, y, r, r * (0.35 + rng() * 0.3), rng() * Math.PI, 0, TAU);
      c.fill();
    }
  } else if (isSeason('spring')) {
    const rg = c.createRadialGradient(W * 0.88, H * 0.05, 0, W * 0.88, H * 0.05, Math.max(W, H) * 0.55);
    rg.addColorStop(0, 'rgba(226,168,180,.10)');
    rg.addColorStop(1, 'rgba(226,168,180,0)');
    c.fillStyle = rg;
    c.fillRect(0, 0, W, H);
  }

  const rng = mulberry32(9);
  const [sr, sg, sb] = s.speck;
  for (let i = 0; i < 3200; i++) {
    const a = rng() * 0.09 + 0.01;
    const v = 90 + rng() * 70;
    if (isSeason('winter')) {
      c.fillStyle = `rgba(${(v + 30) | 0},${(v + 36) | 0},${(v + 38) | 0},${a})`;
    } else {
      c.fillStyle = `rgba(${(v + sr - 108) | 0},${(v + sg - 100) | 0},${(v + sb - 91) | 0},${a})`;
    }
    c.fillRect(rng() * W, rng() * H, 1 + rng() * 1.6, 1 + rng() * 1.2);
  }

  for (let k = 0; k < 38; k++) {
    const inset = 1.035 + k * 0.045;
    const a = Math.max(0, (isSeason('winter') ? 0.11 : 0.155) - k * 0.004);
    c.strokeStyle = s.rake.replace(/[\d.]+\)$/, a + ')');
    c.lineWidth = k % 6 === 0 ? 1.5 : 0.9;
    pondPath(c, inset);
    c.stroke();
  }
}

function drawMossRing(c) {
  const p = KP.pond;
  const rng = mulberry32(23);
  const s = clamp(Math.min(KP.W, KP.H) / 800, 0.55, 1.2);
  const pal = sea().moss;
  c.save();
  for (let i = 0; i < 34; i++) {
    const th = rng() * TAU;
    const R = pondRadius(th) * (1.035 + rng() * 0.075);
    const x = p.cx + Math.cos(th) * p.rx * R;
    const y = p.cy + Math.sin(th) * p.ry * R;
    const r = (14 + rng() * 34) * s;
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    const dark = rng() > 0.5;
    g.addColorStop(0, dark ? pal[0] : pal[1]);
    g.addColorStop(0.65, dark ? pal[2] : pal[1].replace(/[\d.]+\)$/, '0.24)'));
    g.addColorStop(1, isSeason('winter') ? 'rgba(226,236,239,0)' : 'rgba(80,92,50,0)');
    c.fillStyle = g;
    c.beginPath();
    c.ellipse(x, y, r, r * (0.5 + rng() * 0.4), rng() * Math.PI, 0, TAU);
    c.fill();
  }
  if (isSeason('winter')) {
    // exposed moss and grass tips poking through the snow
    for (let i = 0; i < 16; i++) {
      const th = rng() * TAU;
      const R = pondRadius(th) * (1.04 + rng() * 0.06);
      const x = p.cx + Math.cos(th) * p.rx * R;
      const y = p.cy + Math.sin(th) * p.ry * R;
      c.strokeStyle = `rgba(92,108,70,${0.18 + rng() * 0.22})`;
      c.lineWidth = 0.8 + rng() * 0.7;
      c.beginPath();
      c.moveTo(x, y);
      c.lineTo(x + (rng() - 0.5) * 9 * s, y - (3 + rng() * 7) * s);
      c.stroke();
    }
  }
  c.restore();
}

function drawWater(c) {
  const p = KP.pond;
  const cfg = sea();
  const surf = cfg.surface;
  const refl = cfg.reflect;
  c.save();
  pondPath(c, 1);
  c.clip();

  const g = c.createRadialGradient(
    p.cx - p.rx * 0.26, p.cy - p.ry * 0.46, Math.min(p.rx, p.ry) * 0.03,
    p.cx + p.rx * 0.08, p.cy + p.ry * 0.12, Math.max(p.rx, p.ry) * 1.16
  );
  g.addColorStop(0, cfg.water[0]);
  g.addColorStop(0.22, cfg.water[1]);
  g.addColorStop(0.48, cfg.water[2]);
  g.addColorStop(0.72, cfg.water[3]);
  g.addColorStop(0.9, cfg.water[4]);
  g.addColorStop(1, cfg.water[5]);
  c.fillStyle = g;
  c.fillRect(p.cx - p.rx * 1.3, p.cy - p.ry * 1.3, p.rx * 2.6, p.ry * 2.6);

  // deep pool shadow
  const deep = c.createRadialGradient(
    p.cx + p.rx * 0.18, p.cy + p.ry * 0.22, Math.min(p.rx, p.ry) * 0.08,
    p.cx + p.rx * 0.18, p.cy + p.ry * 0.22, Math.min(p.rx, p.ry) * 0.85
  );
  deep.addColorStop(0, 'rgba(3,15,16,.30)');
  deep.addColorStop(0.65, 'rgba(4,18,18,.12)');
  deep.addColorStop(1, 'rgba(4,18,18,0)');
  c.fillStyle = deep;
  c.fillRect(0, 0, KP.W, KP.H);

  // shallow shelf near the bank
  c.save();
  pondPath(c, 0.965);
  c.strokeStyle = `rgba(${surf[0]},${surf[1]},${surf[2]},${cfg.ice ? 0.10 : 0.055})`;
  c.lineWidth = Math.min(p.rx, p.ry) * 0.05;
  c.stroke();
  c.restore();

  // sky reflection — a soft streak toward the light
  c.save();
  pondPath(c, 0.98);
  c.clip();
  c.translate(p.cx - p.rx * 0.22, p.cy - p.ry * 0.45);
  c.rotate(-0.35);
  const sky = c.createLinearGradient(0, -p.ry * 0.35, 0, p.ry * 0.35);
  const skyA = cfg.ice ? 0.15 : 0.12;
  sky.addColorStop(0, `rgba(${surf[0]},${surf[1]},${surf[2]},0)`);
  sky.addColorStop(0.45, `rgba(${surf[0]},${surf[1]},${surf[2]},${skyA * 0.8})`);
  sky.addColorStop(0.55, `rgba(${surf[0]},${surf[1]},${surf[2]},${skyA})`);
  sky.addColorStop(1, `rgba(${surf[0]},${surf[1]},${surf[2]},0)`);
  c.fillStyle = sky;
  c.beginPath();
  c.ellipse(0, 0, p.rx * 0.62, p.ry * 0.34, 0, 0, TAU);
  c.fill();

  // canopy reflection in the upper right water
  const rng = mulberry32(202);
  const reflA = cfg.ice ? 0.035 : 0.06;
  for (let i = 0; i < 10; i++) {
    const rx = p.cx + p.rx * (0.35 + rng() * 0.55);
    const ry = p.cy - p.ry * (0.45 + rng() * 0.35);
    const rr = (14 + rng() * 30) * clamp(Math.min(KP.W, KP.H) / 800, 0.55, 1.15);
    const rg = c.createRadialGradient(rx, ry, 0, rx, ry, rr);
    rg.addColorStop(0, `rgba(${refl[0]},${refl[1]},${refl[2]},${reflA + rng() * 0.04})`);
    rg.addColorStop(1, `rgba(${refl[0]},${refl[1]},${refl[2]},0)`);
    c.fillStyle = rg;
    c.beginPath();
    c.ellipse(rx, ry, rr, rr * 0.5, 0, 0, TAU);
    c.fill();
  }

  // lantern reflection
  const L = KP.env.lantern;
  if (L) {
    const lx = p.cx + p.rx * 0.78;
    const ly = p.cy + p.ry * 0.12;
    const lg = c.createRadialGradient(lx, ly, 0, lx, ly, p.rx * 0.34);
    lg.addColorStop(0, 'rgba(176,146,100,.06)');
    lg.addColorStop(1, 'rgba(150,120,80,0)');
    c.fillStyle = lg;
    c.beginPath();
    c.ellipse(lx, ly, p.rx * 0.36, p.ry * 0.24, 0.2, 0, TAU);
    c.fill();
  }
  c.restore();

  // dark edge (depth under stones)
  const edge = c.createRadialGradient(p.cx, p.cy, Math.min(p.rx, p.ry) * 0.66, p.cx, p.cy, Math.max(p.rx, p.ry) * 1.0);
  edge.addColorStop(0, 'rgba(2,12,12,0)');
  edge.addColorStop(0.82, 'rgba(2,12,12,.16)');
  edge.addColorStop(1, 'rgba(2,10,10,.46)');
  c.fillStyle = edge;
  c.fillRect(0, 0, KP.W, KP.H);

  if (cfg.ice) {
    // thin ice crust creeping in from the shallows
    c.save();
    pondPath(c, 0.985);
    c.clip();
    pondPath(c, 0.952);
    c.strokeStyle = 'rgba(222,239,244,.18)';
    c.lineWidth = Math.min(p.rx, p.ry) * 0.035;
    c.stroke();
    const ir = mulberry32(303);
    for (let i = 0; i < 30; i++) {
      const th = ir() * TAU;
      const R = 0.885 + ir() * 0.09;
      const x = p.cx + Math.cos(th) * p.rx * R;
      const y = p.cy + Math.sin(th) * p.ry * R;
      const rr = (10 + ir() * 26) * clamp(Math.min(KP.W, KP.H) / 800, 0.55, 1.2);
      c.fillStyle = `rgba(218,236,242,${0.075 + ir() * 0.10})`;
      c.strokeStyle = `rgba(238,249,252,${0.10 + ir() * 0.12})`;
      c.lineWidth = 0.8;
      c.beginPath();
      c.ellipse(x, y, rr, rr * (0.32 + ir() * 0.3), th + ir(), 0, TAU);
      c.fill();
      c.stroke();
    }
    c.restore();
  }

  c.restore();
}

function drawUnderwater(c) {
  const p = KP.pond;
  const rng = mulberry32(31);
  c.save();
  pondPath(c, 0.985);
  c.clip();

  // sunken stones
  for (let i = 0; i < 7; i++) {
    const th = rng() * TAU;
    const R = 0.45 + rng() * 0.4;
    const x = p.cx + Math.cos(th) * p.rx * R;
    const y = p.cy + Math.sin(th) * p.ry * R;
    const r = (10 + rng() * 26) * clamp(Math.min(KP.W, KP.H) / 800, 0.6, 1.15);
    const g = c.createRadialGradient(x - r * 0.3, y - r * 0.3, 1, x, y, r);
    g.addColorStop(0, 'rgba(110,135,128,.16)');
    g.addColorStop(0.7, 'rgba(44,72,68,.14)');
    g.addColorStop(1, 'rgba(20,40,38,0)');
    c.fillStyle = g;
    c.beginPath();
    c.ellipse(x, y, r, r * 0.62, rng() * Math.PI, 0, TAU);
    c.fill();
  }

  // old driftwood
  c.strokeStyle = 'rgba(58,66,54,.20)';
  c.lineWidth = 5;
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(p.cx - p.rx * 0.55, p.cy + p.ry * 0.30);
  c.bezierCurveTo(p.cx - p.rx * 0.28, p.cy + p.ry * 0.15, p.cx - p.rx * 0.05, p.cy + p.ry * 0.38, p.cx + p.rx * 0.16, p.cy + p.ry * 0.24);
  c.stroke();

  // silt speckles
  for (let i = 0; i < 140; i++) {
    const th = rng() * TAU, R = Math.sqrt(rng()) * 0.95;
    const x = p.cx + Math.cos(th) * p.rx * R;
    const y = p.cy + Math.sin(th) * p.ry * R;
    c.fillStyle = `rgba(180,200,180,${rng() * 0.05})`;
    c.fillRect(x, y, 1 + rng() * 2, 1 + rng() * 1.5);
  }
  c.restore();
}

function stonePoints(x, y, r, seed, elong = 1) {
  const rr = mulberry32(seed);
  const n = 8 + Math.floor(rr() * 4);
  const rot = rr() * Math.PI;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = rot + i / n * TAU;
    const rad = r * (0.76 + rr() * 0.32);
    pts.push({ x: x + Math.cos(a) * rad * elong, y: y + Math.sin(a) * rad * 0.82 });
  }
  return pts;
}

function drawStoneAt(c, x, y, r, seed, tone, mossy) {
  const rr = mulberry32(seed + 3);
  const pts = stonePoints(x, y, r, seed, 0.9 + rr() * 0.28);
  // contact shadow — tight and soft
  const sh = c.createRadialGradient(x + r * 0.14, y + r * 0.26, r * 0.1, x + r * 0.14, y + r * 0.26, r * 1.35);
  sh.addColorStop(0, 'rgba(46,40,28,.22)');
  sh.addColorStop(1, 'rgba(46,40,28,0)');
  c.fillStyle = sh;
  c.beginPath();
  c.ellipse(x + r * 0.16, y + r * 0.28, r * 1.22, r * 0.92, 0, 0, TAU);
  c.fill();

  smoothClosed(c, pts);
  const g = c.createRadialGradient(x - r * 0.36, y - r * 0.42, r * 0.05, x, y, r * 1.1);
  g.addColorStop(0, tone[0]);
  g.addColorStop(0.48, tone[1]);
  g.addColorStop(1, tone[2]);
  c.fillStyle = g;
  c.fill();

  // stone grain
  c.save();
  smoothClosed(c, pts);
  c.clip();
  for (let i = 0; i < 7; i++) {
    c.fillStyle = rr() > 0.45 ? 'rgba(255,250,238,.055)' : 'rgba(30,28,22,.07)';
    c.beginPath();
    c.arc(x + (rr() * 2 - 1) * r * 0.7, y + (rr() * 2 - 1) * r * 0.55, r * (0.03 + rr() * 0.07), 0, TAU);
    c.fill();
  }
  c.strokeStyle = 'rgba(245,240,226,.07)';
  c.lineWidth = 0.8;
  c.beginPath();
  c.arc(x - r * 0.24, y - r * 0.3, r * 0.48, Math.PI * 1.05, Math.PI * 1.55);
  c.stroke();
  c.restore();

  smoothClosed(c, pts);
  c.strokeStyle = 'rgba(48,42,32,.42)';
  c.lineWidth = 1;
  c.stroke();

  if (mossy && rr() > 0.32) {
    const mx = x - r * 0.25 + rr() * r * 0.5;
    const my = y + r * 0.05 + rr() * r * 0.45;
    const mg = c.createRadialGradient(mx, my, 0, mx, my, r * 0.7);
    mg.addColorStop(0, 'rgba(91,107,55,.55)');
    mg.addColorStop(0.6, 'rgba(82,98,50,.28)');
    mg.addColorStop(1, 'rgba(82,98,50,0)');
    c.fillStyle = mg;
    c.beginPath();
    c.ellipse(mx, my, r * 0.64, r * 0.38, rr() * Math.PI, 0, TAU);
    c.fill();
  }
}

function drawSnowCap(c, x, y, r, seed, alpha = 0.92) {
  const rr = mulberry32(seed + 17);
  c.save();
  c.translate(x, y);
  c.rotate((rr() - 0.5) * 0.16);
  const g = c.createLinearGradient(0, -r * 0.72, 0, -r * 0.02);
  g.addColorStop(0, `rgba(255,255,255,${alpha})`);
  g.addColorStop(0.62, `rgba(247,251,252,${alpha * 0.94})`);
  g.addColorStop(1, 'rgba(234,243,246,0)');
  c.fillStyle = g;
  c.beginPath();
  c.ellipse(-r * 0.04, -r * 0.33, r * (0.72 + rr() * 0.18), r * (0.30 + rr() * 0.10), 0, 0, TAU);
  c.fill();
  c.fillStyle = `rgba(255,255,255,${alpha * 0.7})`;
  c.beginPath();
  c.ellipse(-r * 0.16, -r * 0.46, r * 0.38, r * 0.10, 0, 0, TAU);
  c.fill();
  c.restore();
}

function drawRim(c) {
  const p = KP.pond;
  const cfg = sea();
  const rng = mulberry32(47);
  const s = clamp(Math.min(KP.W, KP.H) / 800, 0.55, 1.2);
  const count = Math.round(clamp((p.rx + p.ry) * 0.072, 34, 66));
  const tones = [
    ['#bdb6a4', '#8f8877', '#5b564a'],
    ['#aaa493', '#7e7869', '#504d42'],
    ['#c3baa4', '#948a75', '#625a48'],
    ['#a39c8c', '#777163', '#4c483e'],
  ];
  for (let i = 0; i < count; i++) {
    if (rng() < 0.10) continue; // mossy gap
    const th = (i / count) * TAU + (rng() - 0.5) * 0.06;
    const R = pondRadius(th);
    const inScale = 1 + (rng() - 0.5) * 0.022;
    const x = p.cx + Math.cos(th) * p.rx * R * inScale;
    const y = p.cy + Math.sin(th) * p.ry * R * inScale;
    let r = (9 + rng() * 13) * s;
    if (i % 11 === 0) r *= 1.55;
    const tone = tones[(rng() * tones.length) | 0];
    drawStoneAt(c, x, y, r, 100 + i, tone, !cfg.snow && rng() > 0.28);
    if (cfg.snow) drawSnowCap(c, x, y, r, 100 + i, 0.95);

    if (rng() < 0.35) {
      const dx = Math.cos(th) * r * (1.1 + rng() * 0.4);
      const dy = Math.sin(th) * r * (0.9 + rng() * 0.35);
      drawStoneAt(c, x + dx, y + dy, (5 + rng() * 6) * s, 700 + i, tones[(rng() * tones.length) | 0], false);
      if (cfg.snow) drawSnowCap(c, x + dx, y + dy, (6 + rng() * 4) * s, 700 + i, 0.72);
    }
  }
  // feature rocks
  const rocks = [[0.9, 1.05, 1.75], [2.62, 1.03, 1.35], [3.55, 1.02, 1.8], [4.7, 1.04, 1.2], [5.4, 1.06, 1.55]];
  for (let i = 0; i < rocks.length; i++) {
    const [th0, sc, mul] = rocks[i];
    const th = th0 + (rng() - 0.5) * 0.08;
    const R = pondRadius(th) * sc;
    const x = p.cx + Math.cos(th) * p.rx * R;
    const y = p.cy + Math.sin(th) * p.ry * R;
    const rr = 18 * s * mul;
    drawStoneAt(c, x, y, rr, 300 + i, tones[i % tones.length], !cfg.snow);
    if (cfg.snow) drawSnowCap(c, x, y, rr, 300 + i, 1);
  }
  // dark grounding under stones
  c.save();
  pondPath(c, 1.004);
  c.strokeStyle = cfg.snow ? 'rgba(112,132,139,.10)' : 'rgba(17,24,18,.09)';
  c.lineWidth = 20 * s;
  c.stroke();
  c.restore();
}

function drawGravelPebbles(c) {
  const rng = mulberry32(511);
  const s = clamp(Math.min(KP.W, KP.H) / 800, 0.55, 1.15);
  const p = KP.pond;
  const snow = sea().snow;
  const groups = [
    { x: p.cx - p.rx * 1.32, y: p.cy + p.ry * 0.6 },
    { x: p.cx + p.rx * 1.28, y: p.cy - p.ry * 0.05 },
    { x: p.cx - p.rx * 0.2, y: p.cy + p.ry * 1.34 },
  ];
  for (const grp of groups) {
    for (let i = 0; i < 9; i++) {
      const a = rng() * TAU;
      const d = Math.sqrt(rng()) * 52 * s;
      const rr = (3.5 + rng() * 5) * s;
      const x = grp.x + Math.cos(a) * d, y = grp.y + Math.sin(a) * d * 0.7;
      drawStoneAt(c, x, y, rr, 800 + i, ['#c6bfae', '#9a9382', '#6d6759'], !snow && rng() > 0.6);
      if (snow) drawSnowCap(c, x, y, rr, 800 + i, 0.8);
    }
  }
}

function drawSteppingStones(c) {
  const L = KP.env.lantern;
  const rng = mulberry32(53);
  const s = clamp(Math.min(KP.W, KP.H) / 800, 0.55, 1.2);
  const snow = sea().snow;
  const endX = KP.W * 0.965, endY = KP.H * 0.945;
  for (let i = 0; i < 5; i++) {
    const t = (i + 0.5) / 5;
    const x = lerp(L.x + L.r * 0.15, endX, t) + Math.sin(t * 3) * 8;
    const y = lerp(L.y + L.r * 1.7, endY, t);
    const rr = (11 + rng() * 5) * s;
    drawStoneAt(c, x, y, rr, 500 + i, ['#c9c2b1', '#a29b8a', '#736c5d'], !snow && rng() > 0.6);
    if (snow) drawSnowCap(c, x, y, rr, 500 + i, 0.95);
  }
}

function drawLantern(c) {
  const { x, y, r } = KP.env.lantern;
  c.save();
  // shadow
  const sh = c.createRadialGradient(x + r * 0.4, y + r * 0.55, r * 0.2, x + r * 0.4, y + r * 0.55, r * 1.6);
  sh.addColorStop(0, 'rgba(48,40,28,.34)');
  sh.addColorStop(1, 'rgba(48,40,28,0)');
  c.fillStyle = sh;
  c.beginPath(); c.ellipse(x + r * 0.4, y + r * 0.55, r * 1.6, r * 1.15, 0.2, 0, TAU); c.fill();

  c.translate(x, y);
  c.rotate(-0.05);
  // stone plinth
  const pg = c.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r * 0.98);
  pg.addColorStop(0, '#b6ae9b');
  pg.addColorStop(0.6, '#8f8877');
  pg.addColorStop(1, '#615b4e');
  c.fillStyle = pg;
  c.beginPath(); c.arc(0, 0, r * 0.96, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(52,46,36,.4)';
  c.lineWidth = 1;
  c.stroke();

  // roof
  const rg = c.createLinearGradient(-r, -r, r, r);
  rg.addColorStop(0, '#b9b2a1');
  rg.addColorStop(0.5, '#98917f');
  rg.addColorStop(1, '#6c6657');
  c.fillStyle = rg;
  roundRectPath(c, -r * 0.92, -r * 0.92, r * 1.84, r * 1.84, r * 0.2);
  c.fill();
  c.strokeStyle = 'rgba(48,43,34,.45)';
  c.lineWidth = 1.2;
  c.stroke();

  // upturned corners
  for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    const cx = sx * r * 0.84, cy = sy * r * 0.84;
    const cg = c.createRadialGradient(cx - r * 0.05, cy - r * 0.06, 1, cx, cy, r * 0.26);
    cg.addColorStop(0, '#c6beac');
    cg.addColorStop(1, '#7d7666');
    c.fillStyle = cg;
    c.beginPath(); c.arc(cx, cy, r * 0.24, 0, TAU); c.fill();
  }

  // roof ribs
  c.strokeStyle = 'rgba(70,64,52,.22)';
  c.lineWidth = 1;
  for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
    c.beginPath();
    c.moveTo(sx * r * 0.86, sy * r * 0.86);
    c.lineTo(sx * r * 0.5, sy * r * 0.5);
    c.stroke();
  }

  // inner tier
  const ig = c.createRadialGradient(-r * 0.15, -r * 0.2, r * 0.05, 0, 0, r * 0.7);
  ig.addColorStop(0, '#a49c89');
  ig.addColorStop(1, '#716a5a');
  c.fillStyle = ig;
  roundRectPath(c, -r * 0.64, -r * 0.64, r * 1.28, r * 1.28, r * 0.12);
  c.fill();
  c.strokeStyle = 'rgba(48,43,34,.35)';
  c.stroke();

  // fire box
  const fg = c.createRadialGradient(-r * 0.1, -r * 0.12, r * 0.02, 0, 0, r * 0.4);
  fg.addColorStop(0, '#403a2e');
  fg.addColorStop(1, '#221f19');
  c.fillStyle = fg;
  c.beginPath(); c.arc(0, 0, r * 0.37, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(190,178,150,.25)';
  c.lineWidth = 1;
  c.stroke();

  // six window openings
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * TAU;
    c.fillStyle = 'rgba(15,13,10,.85)';
    c.beginPath();
    c.ellipse(Math.cos(a) * r * 0.24, Math.sin(a) * r * 0.24, r * 0.075, r * 0.05, a, 0, TAU);
    c.fill();
  }

  // finial
  c.fillStyle = '#8c8473';
  c.beginPath(); c.arc(0, 0, r * 0.1, 0, TAU); c.fill();
  c.strokeStyle = 'rgba(225,214,188,.35)';
  c.lineWidth = 0.8;
  c.stroke();
  c.beginPath(); c.arc(0, 0, r * 0.055, 0, TAU); c.stroke();

  // moss / snow
  const cfg = sea();
  if (cfg.snow) {
    c.fillStyle = 'rgba(251,254,255,.92)';
    c.beginPath(); c.ellipse(-r * 0.04, -r * 0.78, r * 0.68, r * 0.16, -0.04, 0, TAU); c.fill();
    c.beginPath(); c.ellipse(-r * 0.58, -r * 0.55, r * 0.24, r * 0.10, -0.35, 0, TAU); c.fill();
    c.fillStyle = 'rgba(226,239,244,.8)';
    c.beginPath(); c.ellipse(r * 0.52, -r * 0.62, r * 0.18, r * 0.07, 0.3, 0, TAU); c.fill();
    c.fillStyle = 'rgba(248,252,253,.85)';
    c.beginPath(); c.ellipse(-r * 0.5, r * 0.64, r * 0.26, r * 0.12, -0.5, 0, TAU); c.fill();
  } else {
    c.fillStyle = isSeason('summer') ? 'rgba(79,106,48,.46)' : isSeason('spring') ? 'rgba(104,128,62,.42)' : 'rgba(100,114,62,.42)';
    c.beginPath(); c.ellipse(-r * 0.55, r * 0.62, r * 0.28, r * 0.16, -0.5, 0, TAU); c.fill();
    c.fillStyle = 'rgba(88,102,54,.35)';
    c.beginPath(); c.ellipse(r * 0.62, -r * 0.5, r * 0.2, r * 0.12, 0.4, 0, TAU); c.fill();
  }
  c.restore();
}

function drawReeds(c) {
  const p = KP.pond;
  const rng = mulberry32(61);
  const s = clamp(Math.min(KP.W, KP.H) / 800, 0.6, 1.15);
  const cfg = sea();
  const pal = cfg.reeds;
  const tall = isSeason('summer') ? 1.15 : isSeason('winter') ? 0.86 : 1;
  const spots = [[3.92, 1.015], [5.28, 1.01]];
  for (const [th, sc] of spots) {
    const bx = p.cx + Math.cos(th) * p.rx * pondRadius(th) * sc;
    const by = p.cy + Math.sin(th) * p.ry * pondRadius(th) * sc;
    // moss / snow base
    const bg = c.createRadialGradient(bx, by, 0, bx, by, 44 * s);
    bg.addColorStop(0, cfg.snow ? 'rgba(252,254,255,.62)' : 'rgba(86,100,52,.55)');
    bg.addColorStop(1, cfg.snow ? 'rgba(240,247,249,0)' : 'rgba(86,100,52,0)');
    c.fillStyle = bg;
    c.beginPath(); c.ellipse(bx, by, 40 * s, 26 * s, 0, 0, TAU); c.fill();
    for (let i = 0; i < 30; i++) {
      const a = th - 1.15 + rng() * 2.3;
      const len = (26 + rng() * 46) * s * tall;
      const bend = (rng() - 0.5) * 26 * s;
      const ex = bx + Math.cos(a) * len;
      const ey = by + Math.sin(a) * len * 0.75;
      const g = c.createLinearGradient(bx, by, ex, ey);
      const col = pal[(rng() * pal.length) | 0];
      g.addColorStop(0, hexA(col, 0.9));
      g.addColorStop(1, hexA(col, cfg.snow ? 0.55 : 0.35));
      c.strokeStyle = g;
      c.lineWidth = 1 + rng() * 1.7;
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(bx + (rng() - 0.5) * 14 * s, by + (rng() - 0.5) * 8 * s);
      c.quadraticCurveTo(bx + Math.cos(a) * len * 0.5 - bend, by + Math.sin(a) * len * 0.4, ex, ey);
      c.stroke();
      if (cfg.snow) {
        c.strokeStyle = 'rgba(252,255,255,.82)';
        c.lineWidth = 1.4;
        c.beginPath();
        c.moveTo(ex - Math.cos(a) * 5 * s, ey - Math.sin(a) * 3 * s);
        c.lineTo(ex, ey);
        c.stroke();
      }
    }
  }
}

function traceMapleLeaf(c, x, y, r, rot, fill, withStem = true, stroke = 'rgba(92,34,24,.20)', vein = 'rgba(96,32,22,.22)') {
  c.save();
  c.translate(x, y);
  c.rotate(rot);
  c.beginPath();
  c.moveTo(0, -r);
  c.bezierCurveTo(r * 0.10, -r * 0.78, r * 0.30, -r * 0.68, r * 0.32, -r * 0.40);
  c.bezierCurveTo(r * 0.55, -r * 0.58, r * 0.82, -r * 0.47, r * 0.73, -r * 0.20);
  c.bezierCurveTo(r * 0.96, -r * 0.04, r * 0.90, r * 0.16, r * 0.62, r * 0.19);
  c.bezierCurveTo(r * 0.72, r * 0.42, r * 0.46, r * 0.56, r * 0.28, r * 0.40);
  c.bezierCurveTo(r * 0.22, r * 0.62, r * 0.05, r * 0.64, 0, r * 0.44);
  c.bezierCurveTo(-r * 0.05, r * 0.64, -r * 0.22, r * 0.62, -r * 0.28, r * 0.40);
  c.bezierCurveTo(-r * 0.46, r * 0.56, -r * 0.72, r * 0.42, -r * 0.62, r * 0.19);
  c.bezierCurveTo(-r * 0.90, r * 0.16, -r * 0.96, -r * 0.04, -r * 0.73, -r * 0.20);
  c.bezierCurveTo(-r * 0.82, -r * 0.47, -r * 0.55, -r * 0.58, -r * 0.32, -r * 0.40);
  c.bezierCurveTo(-r * 0.30, -r * 0.68, -r * 0.10, -r * 0.78, 0, -r);
  c.closePath();
  c.fillStyle = fill;
  c.fill();
  c.strokeStyle = stroke;
  c.lineWidth = Math.max(0.35, r * 0.035);
  c.stroke();

  // veins
  c.strokeStyle = vein;
  c.lineWidth = Math.max(0.35, r * 0.045);
  const veins = [[0, -0.86], [0.55, -0.3], [-0.55, -0.3], [0.45, 0.3], [-0.45, 0.3]];
  for (const [vx, vy] of veins) {
    c.beginPath();
    c.moveTo(0, r * 0.3);
    c.lineTo(vx * r, vy * r);
    c.stroke();
  }
  if (withStem) {
    c.strokeStyle = 'rgba(88,50,30,.62)';
    c.lineWidth = Math.max(0.6, r * 0.10);
    c.beginPath();
    c.moveTo(0, r * 0.4);
    c.quadraticCurveTo(r * 0.08, r * 0.85, r * 0.16, r * 1.25);
    c.stroke();
  }
  c.restore();
}

function tracePetal(c, x, y, r, rot, fill, alpha = 1) {
  c.save();
  c.translate(x, y);
  c.rotate(rot);
  c.globalAlpha = alpha;
  c.fillStyle = fill;
  c.beginPath();
  c.moveTo(0, -r);
  c.bezierCurveTo(r * 0.72, -r * 0.62, r * 0.66, r * 0.34, 0, r * 0.78);
  c.bezierCurveTo(-r * 0.66, r * 0.34, -r * 0.72, -r * 0.62, 0, -r);
  c.fill();
  c.strokeStyle = 'rgba(160,82,98,.16)';
  c.lineWidth = Math.max(0.3, r * 0.03);
  c.stroke();
  c.restore();
}

function traceSakura(c, x, y, r, rot, fill, center = 'rgba(242,206,154,.9)') {
  c.save();
  c.translate(x, y);
  c.rotate(rot);
  for (let i = 0; i < 5; i++) {
    c.save();
    c.rotate((i / 5) * TAU);
    c.fillStyle = fill;
    c.beginPath();
    c.ellipse(0, -r * 0.62, r * 0.46, r * 0.66, 0, 0, TAU);
    c.fill();
    c.strokeStyle = 'rgba(190,110,125,.14)';
    c.lineWidth = Math.max(0.25, r * 0.03);
    c.stroke();
    c.restore();
  }
  c.fillStyle = center;
  c.beginPath();
  c.arc(0, 0, r * 0.24, 0, TAU);
  c.fill();
  c.restore();
}

function taperedBranch(c, p0, p1, p2, w0, w1, color) {
  const N = 16;
  const left = [], right = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const mt = 1 - t;
    const x = mt * mt * p0[0] + 2 * mt * t * p1[0] + t * t * p2[0];
    const y = mt * mt * p0[1] + 2 * mt * t * p1[1] + t * t * p2[1];
    const tx = 2 * mt * (p1[0] - p0[0]) + 2 * t * (p2[0] - p1[0]);
    const ty = 2 * mt * (p1[1] - p0[1]) + 2 * t * (p2[1] - p1[1]);
    const len = Math.hypot(tx, ty) || 1;
    const nx = -ty / len, ny = tx / len;
    const w = lerp(w0, w1, t) * 0.5;
    left.push({ x: x + nx * w, y: y + ny * w });
    right.push({ x: x - nx * w, y: y - ny * w });
  }
  c.beginPath();
  c.moveTo(left[0].x, left[0].y);
  for (const q of left) c.lineTo(q.x, q.y);
  for (let i = right.length - 1; i >= 0; i--) c.lineTo(right[i].x, right[i].y);
  c.closePath();
  c.fillStyle = color;
  c.fill();
  c.strokeStyle = 'rgba(40,30,20,.35)';
  c.lineWidth = 0.7;
  c.stroke();
}

function drawMaple(c) {
  const { scale } = KP.env.maple;
  const cfg = sea();
  const kind = cfg.tree;
  const rng = mulberry32(97);
  const W = KP.W, H = KP.H;
  const branches = [
    [[W + 40, -30], [W * 0.955, H * 0.015], [W * 0.79, H * 0.125], 14, 3],
    [[W + 30, H * 0.20], [W * 0.93, H * 0.17], [W * 0.755, H * 0.245], 10, 2],
    [[W * 0.90, H * 0.09], [W * 0.865, H * 0.17], [W * 0.79, H * 0.205], 6, 1.4],
    [[W * 0.82, H * 0.115], [W * 0.80, H * 0.055], [W * 0.755, H * 0.02], 5, 1.2],
    [[W * 0.94, H * 0.155], [W * 0.965, H * 0.23], [W * 0.985, H * 0.30], 5, 1.1],
  ];
  c.save();
  c.lineCap = 'round';
  for (const b of branches) {
    taperedBranch(c, b[0], b[1], b[2], b[3] * scale, b[4] * scale, kind === 'bare' ? '#4f3d2d' : '#4b3927');
    c.strokeStyle = 'rgba(122,94,62,.55)';
    c.lineWidth = 1.1 * scale;
    c.beginPath();
    c.moveTo(b[0][0], b[0][1]);
    c.quadraticCurveTo(b[1][0], b[1][1] - 1.4, b[2][0] + 1, b[2][1] - 1.4);
    c.stroke();
    if (kind === 'bare') {
      c.strokeStyle = 'rgba(252,254,255,.86)';
      c.lineWidth = 2.4 * scale;
      c.beginPath();
      c.moveTo(b[0][0], b[0][1] - 1.2);
      c.quadraticCurveTo(b[1][0], b[1][1] - 2.6, b[2][0] + 1, b[2][1] - 2.8);
      c.stroke();
    }
  }

  const anchors = [
    [W * 0.80, H * 0.135], [W * 0.755, H * 0.18], [W * 0.865, H * 0.085],
    [W * 0.925, H * 0.135], [W * 0.965, H * 0.205], [W * 0.80, H * 0.235],
    [W * 0.885, H * 0.235], [W * 0.84, H * 0.045], [W * 0.985, H * 0.275],
  ];

  if (kind === 'bare') {
    // snow resting on bare twigs and a few dry seed pods
    for (const [ax, ay] of anchors) {
      for (let i = 0; i < 4; i++) {
        const a = rng() * TAU;
        const rr = Math.sqrt(rng()) * 25 * scale;
        const lx = ax + Math.cos(a) * rr * 1.15;
        const ly = ay + Math.sin(a) * rr * 0.75;
        const size = (4 + rng() * 7) * scale;
        c.fillStyle = `rgba(252,254,255,${0.62 + rng() * 0.28})`;
        c.beginPath();
        c.ellipse(lx, ly, size, size * 0.36, (rng() - 0.5) * 0.8, 0, TAU);
        c.fill();
      }
    }
    const dry = ['#a85b38', '#8f4a2e', '#b97144'];
    for (let i = 0; i < 8; i++) {
      const [ax, ay] = anchors[(rng() * anchors.length) | 0];
      const lx = ax + (rng() - 0.5) * 44 * scale;
      const ly = ay + (rng() - 0.5) * 28 * scale;
      traceMapleLeaf(c, lx, ly, (2.6 + rng() * 2.4) * scale, rng() * TAU, dry[(rng() * dry.length) | 0], false);
    }
    c.restore();
    return;
  }

  if (kind === 'sakura') {
    const pinks = ['#f7dbe2', '#f3c4d0', '#fae9ee', '#efb0c1', '#f5d1da'];
    const greens = ['#7f9a5a', '#6d8a4c', '#8fa968'];
    for (const [ax, ay] of anchors) {
      for (let i = 0; i < 15; i++) {
        const a = rng() * TAU;
        const rr = Math.sqrt(rng()) * 32 * scale;
        const lx = ax + Math.cos(a) * rr * 1.08;
        const ly = ay + Math.sin(a) * rr * 0.8;
        const size = (3.8 + rng() * 3.4) * scale;
        const rot = rng() * TAU;
        const col = pinks[(rng() * pinks.length) | 0];
        traceSakura(c, lx + 2, ly + 2.6, size, rot, 'rgba(160,92,106,.16)', 'rgba(140,74,86,.10)');
        traceSakura(c, lx, ly, size, rot, col);
      }
      for (let i = 0; i < 4; i++) {
        const a = rng() * TAU;
        const rr = Math.sqrt(rng()) * 30 * scale;
        tracePetal(
          c, ax + Math.cos(a) * rr, ay + Math.sin(a) * rr * 0.8,
          (2.2 + rng() * 2.2) * scale, rng() * TAU,
          greens[(rng() * greens.length) | 0], 0.9
        );
      }
    }
    c.restore();
    return;
  }

  const greening = kind === 'green';
  const cols = greening
    ? ['#4c6c33', '#5c7e3d', '#41602b', '#6e8f49', '#375326', '#7f9c57']
    : ['#a92f1e', '#c14528', '#8e2418', '#cf5a30', '#7f2015', '#b73a22', '#d08240'];
  const edge = greening ? 'rgba(44,66,30,.20)' : 'rgba(92,34,24,.20)';
  const vein = greening ? 'rgba(46,66,30,.22)' : 'rgba(96,32,22,.22)';
  const leafN = greening ? 24 : 22;
  for (const [ax, ay] of anchors) {
    for (let i = 0; i < leafN; i++) {
      const a = rng() * TAU;
      const rr = Math.sqrt(rng()) * (greening ? 36 : 31) * scale;
      const lx = ax + Math.cos(a) * rr * 1.1;
      const ly = ay + Math.sin(a) * rr * 0.8;
      const size = (greening ? 7 + rng() * 9 : 6 + rng() * 8) * scale;
      const rot = rng() * TAU;
      const col = cols[(rng() * cols.length) | 0];
      traceMapleLeaf(c, lx + 2.5, ly + 3.2, size, rot, 'rgba(45,35,22,.14)', false, edge, vein);
      traceMapleLeaf(c, lx, ly, size, rot, col, true, edge, vein);
    }
  }
  c.restore();
}

function drawGravelLeaves(c) {
  const rng = mulberry32(73);
  const s = clamp(Math.min(KP.W, KP.H) / 800, 0.55, 1.15);
  const cfg = sea();
  if (cfg.snow) return;
  if (cfg.ambient === 'petal') {
    const cols = ['#f3c6d2', '#f7dbe2', '#eeb2c3', '#f9e6ec'];
    for (let i = 0; i < 24; i++) {
      const side = rng() > 0.55;
      const x = side ? KP.W * (0.04 + rng() * 0.34) : KP.W * (0.70 + rng() * 0.26);
      const y = KP.H * (0.58 + rng() * 0.38);
      const size = (2.8 + rng() * 3.2) * s;
      tracePetal(c, x, y, size, rng() * TAU, cols[(rng() * cols.length) | 0], 0.9);
    }
    return;
  }
  const cols = cfg.ambient === 'pollen'
    ? ['#7c944f', '#8aa35c', '#6a8142']
    : ['#b03a25', '#c0512d', '#96301f', '#c96833'];
  const n = cfg.ambient === 'pollen' ? 8 : 13;
  for (let i = 0; i < n; i++) {
    const side = rng() > 0.5;
    const x = side ? KP.W * (0.05 + rng() * 0.3) : KP.W * (0.72 + rng() * 0.24);
    const y = KP.H * (0.6 + rng() * 0.36);
    const size = (4.5 + rng() * 5) * s;
    const rot = rng() * TAU;
    traceMapleLeaf(c, x + 2, y + 2.5, size, rot, 'rgba(45,35,22,.16)', false);
    traceMapleLeaf(c, x, y, size, rot, cols[(rng() * cols.length) | 0], true);
  }
}

function buildPads() {
  const p = KP.pond;
  const cfg = sea();
  if (!cfg.padScale) return [];
  const mn = Math.min(p.rx, p.ry);
  const defs = [
    { px: -0.60, py: 0.40, r: mn * 0.155, lotus: 0 },
    { px: 0.55, py: -0.48, r: mn * 0.115, lotus: 1 },
    { px: 0.63, py: 0.34, r: mn * 0.125, lotus: 0 },
    { px: -0.26, py: -0.66, r: mn * 0.082, lotus: 0 },
    { px: 0.30, py: 0.63, r: mn * 0.09, lotus: 2 },
  ];
  return defs.map((d, i) => ({
    x: p.cx + p.rx * d.px,
    y: p.cy + p.ry * d.py,
    r: d.r * cfg.padScale,
    notch: rnd(0, TAU),
    ph: rnd(0, TAU),
    lotus: d.lotus > 0 && d.lotus <= cfg.lotuses,
    bud: d.lotus === 2 && cfg.lotuses < 2,
    seed: 900 + i,
  }));
}

function buildFloating() {
  const p = KP.pond;
  const rng = mulberry32(151);
  const cfg = sea();
  if (cfg.ambient === 'snow') return [];
  const types = {
    petal: { n: 11, cols: ['#f3c6d2', '#f7dbe2', '#eeb2c3', '#f9e6ec'], type: 'petal', r: [2.6, 4.2] },
    pollen: { n: 4, cols: ['#6e8a45', '#7d9a50', '#5e7a3a'], type: 'leaf', r: [3.6, 5.2] },
    leaf: { n: 6, cols: ['#b23c26', '#c2572d', '#98301f', '#c96a35'], type: 'maple', r: [4, 7] },
  };
  const t = types[cfg.ambient] || types.leaf;
  const arr = [];
  for (let i = 0; i < t.n; i++) {
    const th = rng() * TAU;
    const rr = Math.sqrt(rng()) * 0.78;
    arr.push({
      x: p.cx + Math.cos(th) * p.rx * rr,
      y: p.cy + Math.sin(th) * p.ry * rr,
      r: t.r[0] + rng() * (t.r[1] - t.r[0]),
      rot: rng() * TAU,
      spin: (rng() - 0.5) * 0.25,
      vx: (rng() - 0.5) * 5,
      vy: (rng() - 0.5) * 4,
      color: t.cols[(rng() * t.cols.length) | 0],
      type: t.type,
    });
  }
  return arr;
}

function renderBackground() {
  const { W, H, DPR } = KP;
  if (!KP.bg) KP.bg = document.createElement('canvas');
  const bg = KP.bg;
  bg.width = Math.max(1, Math.round(W * DPR));
  bg.height = Math.max(1, Math.round(H * DPR));
  const c = bg.getContext('2d');
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, W, H);

  drawRakedGravel(c);
  drawMossRing(c);

  // soft halo before water
  const p = KP.pond;
  const halo = c.createRadialGradient(p.cx, p.cy, Math.min(p.rx, p.ry) * 0.85, p.cx, p.cy, Math.max(p.rx, p.ry) * 1.1);
  halo.addColorStop(0, 'rgba(40,44,30,0)');
  halo.addColorStop(1, 'rgba(52,48,34,.14)');
  c.fillStyle = halo;
  c.fillRect(0, 0, W, H);

  drawWater(c);
  drawUnderwater(c);
  drawRim(c);
  drawGravelPebbles(c);
  drawSteppingStones(c);
  drawLantern(c);
  drawReeds(c);
  drawMaple(c);
  drawGravelLeaves(c);
}

const VARIETIES = [

    key: 'kohaku', jp: '紅白', en: 'Kōhaku', desc: '雪の上を、緋が渡る', cm: 70,
