.app { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; padding: 30px 18px 42px; min-height: 100dvh; }
header { margin-bottom: 18px; }
.tag { display:inline-block; font-size:.68rem; font-weight:800; letter-spacing:.12em; color:var(--red); background:oklch(0.6 0.2 24 / .1); padding:4px 13px; border-radius:100px; margin-bottom:10px; }

.toast.show { opacity:1; transform:translateX(-50%) translateY(-4px); }

{id:'d1',name:'麻婆豆腐',cat:'sichuan',kcal:'约 180 kcal',desc:'麻辣鲜香，下饭效率极高。适合想要一点刺激的晚上。',emoji:'🫘'}, {id:'d2',name:'水煮鱼',cat:'sichuan',kcal:'约 350 kcal',desc:'红油、花椒、嫩鱼片，一口把疲惫点燃。',emoji:'🐟'}, {id:'d3',name:'剁椒鱼头',cat:'sichuan',kcal:'约 300 kcal',desc:'鲜辣开胃，适合两三个人一起分。',emoji:'🌶️'}, {id:'d4',name:'口水鸡',cat:'sichuan',kcal:'约 260 kcal',desc:'凉菜里的重火力，香辣但不笨重。',emoji:'🍗'},

{id:'d25',name:'重庆火锅',cat:'hotpot',kcal:'约 700 kcal',desc:'适合人多，适合发泄，也适合庆祝。',emoji:'🌶️'}, {id:'d26',name:'羊肉串',cat:'hotpot',kcal:'约 350 kcal',desc:'孜然和炭火，是夜晚的底层协议。',emoji:'🍢'}, {id:'d27',name:'烤鱼',cat:'hotpot',kcal:'约 420 kcal',desc:'鱼和配菜一起咕嘟，越吃越有。',emoji:'🐟'}, {id:'d28',name:'潮汕牛肉火锅',cat:'hotpot',kcal:'约 520 kcal',desc:'清汤见功夫，牛肉要趁鲜。',emoji:'🥩'},
{id:'d29',name:'牛排',cat:'western',kcal:'约 450 kcal',desc:'外焦里嫩，适合需要一点仪式感。',emoji:'🥩'}, {id:'d30',name:'意大利面',cat:'western',kcal:'约 380 kcal',desc:'番茄肉酱或奶油培根，都是安全牌。',emoji:'🍝'}, {id:'d31',name:'汉堡',cat:'western',kcal:'约 480 kcal',desc:'罪恶但高效，快乐来得很快。',emoji:'🍔'}, {id:'d32',name:'披萨',cat:'western',kcal:'约 520 kcal',desc:'适合分享，也适合一个人假装分享。',emoji:'🍕'},

{id:'d37',name:'皮蛋瘦肉粥',cat:'light',kcal:'约 200 kcal',desc:'胃需要被温柔对待时，它很合适。',emoji:'🥣'}, {id:'d38',name:'沙拉轻食',cat:'light',kcal:'约 260 kcal',desc:'不是惩罚，是给身体减一点负担。',emoji:'🥗'}, {id:'d39',name:'番茄牛腩汤',cat:'light',kcal:'约 320 kcal',desc:'酸甜浓汤，热乎但不油腻。',emoji:'🍅'}, {id:'d40',name:'云吞汤',cat:'light',kcal:'约 280 kcal',desc:'汤清、馅鲜、负担低。',emoji:'🥣'}
].map((d,i)=>({...d,bg:BG[i%BG.length]}));
let mode='dish',currentCat='all',currentDish=null,favorites=JSON.parse(localStorage.getItem('eat_favs_v2')||'[]'),nearby=[];
const $=id=>document.getElementById(id), card=$('card'), visual=$('visual'), emoji=$('emoji'), badge=$('badge'), distance=$('distance'), nameEl=$('name'), kcalEl=$('kcal'), descEl=$('desc'), favList=$('favList'), toast=$('toast');
function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),2000)}
function filtered(){return currentCat==='all'?DISHES:DISHES.filter(d=>d.cat===currentCat)}
function rand(arr){return arr[Math.floor(Math.random()*arr.length)]}
function pick(){const pool=mode==='nearby'&&nearby.length?nearby:filtered();let d;do{d=rand(pool)}while(pool.length>1&&d===currentDish);return d}
function renderCard(d,animate=true){currentDish=d;if(animate){card.classList.add('out');card.classList.remove('in');setTimeout(()=>{apply(d);card.classList.remove('out');card.classList.add('in')},260)}else{apply(d);card.classList.add('in')}}
function apply(d){visual.style.background=d.bg||BG[0];emoji.textContent=d.emoji||'🍽️';badge.textContent=d.badge||CATS[d.cat]||'附近';nameEl.textContent=d.name;kcalEl.textContent=d.kcal||d.meta||'附近餐馆';descEl.textContent=d.desc;distance.textContent=d.distance?`${d.distance}m`:'';distance.classList.toggle('show',!!d.distance)}
function renderFavs(){if(!favorites.length){favList.innerHTML='<span class="tip">还没有收藏，遇到喜欢的点「就吃这个」吧</span>';return}favList.innerHTML=favorites.map(x=>`<span class="fav-tag">${x.emoji||'🍽️'} ${x.name} <span class="del" data-name="${x.name}">x</span></span>`).join('')}
function saveFav(){if(!currentDish)return;const exists=favorites.some(x=>x.name===currentDish.name);favorites=exists?favorites.filter(x=>x.name!==currentDish.name):[{name:currentDish.name,emoji:currentDish.emoji},...favorites].slice(0,20);localStorage.setItem('eat_favs_v2',JSON.stringify(favorites));renderFavs();showToast(exists?'已取消收藏':'已加入收藏 ❤️')}
Object.entries(CATS).forEach(([key,label])=>{const b=document.createElement('button');b.className='f-btn'+(key==='all'?' on':'');b.textContent=label;b.onclick=()=>{document.querySelectorAll('.f-btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');currentCat=key;mode='dish';syncMode();renderCard(pick())};$('filters').appendChild(b)});
function syncMode(){$('modeDish').classList.toggle('on',mode==='dish');$('modeNearby').classList.toggle('on',mode==='nearby');$('locPanel').classList.toggle('show',mode==='nearby')}
$('modeDish').onclick=()=>{mode='dish';syncMode();renderCard(pick())}; $('modeNearby').onclick=()=>{mode='nearby';syncMode(); if(nearby.length)renderCard(pick()); else showToast('先点「定位附近」')};
$('btnSkip').onclick=()=>renderCard(pick()); $('btnReroll').onclick=()=>renderCard(pick()); $('btnLike').onclick=saveFav; favList.onclick=e=>{if(e.target.className==='del'){favorites=favorites.filter(x=>x.name!==e.target.dataset.name);localStorage.setItem('eat_favs_v2',JSON.stringify(favorites));renderFavs()}};
function hav(lat1,lon1,lat2,lon2){const R=6371000,toRad=x=>x*Math.PI/180,dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1),a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)))}
function cuisineEmoji(t=''){t=t.toLowerCase();if(/hotpot|chinese|sichuan|火锅|川|湘|中/.test(t))return'🌶️';if(/noodle|ramen|面|粉/.test(t))return'🍜';if(/japan|sushi|日/.test(t))return'🍣';if(/korean|韩/.test(t))return'🍲';if(/pizza|italian|burger|western/.test(t))return'🍕';if(/coffee|cafe/.test(t))return'☕';if(/bbq|grill|烧烤/.test(t))return'🍢';return'🍽️'}
async function locate(){if(!navigator.geolocation){showToast('浏览器不支持定位');return}const btn=$('btnLocate');btn.classList.add('loading');btn.textContent='定位中…';navigator.geolocation.getCurrentPosition(async pos=>{const {latitude:lat,longitude:lon}=pos.coords;$('locText').textContent='定位成功，正在索引 1500 米内餐馆…';try{const query=`[out:json][timeout:18];(node["amenity"~"restaurant|fast_food|cafe|food_court"](around:1500,${lat},${lon});way["amenity"~"restaurant|fast_food|cafe|food_court"](around:1500,${lat},${lon});relation["amenity"~"restaurant|fast_food|cafe|food_court"](around:1500,${lat},${lon}););out center tags 40;`;const res=await fetch('https://overpass-api.de/api/interpreter',{method:'POST',body:query});const data=await res.json();nearby=(data.elements||[]).map((e,i)=>{const la=e.lat||e.center?.lat,lo=e.lon||e.center?.lon,t=e.tags||{},dist=la&&lo?hav(lat,lon,la,lo):null,kind=t.cuisine||t.amenity||'附近美食',em=cuisineEmoji(kind);return{id:'n'+i,name:t.name||`${kind}小店`,cat:'nearby',badge:'附近 '+kind,emoji:em,kcal:dist?`距离约 ${dist} 米`:'附近餐馆',distance:dist,desc:`来自周边地图索引。${t.name?`这家店标注为「${kind}」，`:''}不想纠结的话，可以就近试试它。`,bg:BG[i%BG.length]}}).filter(x=>x.name).sort((a,b)=>(a.distance||9999)-(b.distance||9999)).slice(0,30);if(!nearby.length)throw new Error('empty');$('locText').textContent=`已索引到 ${nearby.length} 个附近美食点，优先推荐距离近的。`;$('nearbyList').innerHTML=nearby.slice(0,10).map(x=>`<span class="nearby-item">${x.emoji} ${x.name}${x.distance?` · ${x.distance}m`:''}</span>`).join('');mode='nearby';syncMode();renderCard(pick());showToast('周边美食已加载')}catch(e){$('locText').textContent='周边接口暂时不可用，已切回本地菜系推荐。';showToast('免费接口有点忙，先用本地推荐')}finally{btn.classList.remove('loading');btn.textContent='重新定位'}},err=>{btn.classList.remove('loading');btn.textContent='定位附近';showToast(err.code===1?'需要允许定位权限':'定位失败，请稍后再试')},{enableHighAccuracy:false,timeout:10000,maximumAge:300000})}
$('btnLocate').onclick=locate;
$('btnShare').onclick=async()=>{const data={title:document.title,text:'今天吃什么？让附近美食替你做决定。',url:location.href};if(navigator.share){try{await navigator.share(data)}catch(e){}}else{showToast('点右上角分享到微信')}};
$('btnCopy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);showToast('链接已复制')}catch(e){showToast('复制失败，请手动复制地址')}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')$('btnSkip').click();if(e.key==='ArrowRight')$('btnLike').click();if(e.key===' '){e.preventDefault();$('btnReroll').click()}});
renderFavs();renderCard(pick(),false);
</script>
</body>
